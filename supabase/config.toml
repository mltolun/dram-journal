# Auth settings. Push to the hosted project with `supabase config push`
# (review the diff first) or mirror them in Dashboard → Authentication.
[auth]
site_url = "https://dramjournal.online"
additional_redirect_urls = ["https://dramjournal.online/**", "http://localhost:5173/**"]
minimum_password_length = 10

[auth.rate_limit]
sign_in_sign_ups = 30
token_refresh = 150

[auth.email]
double_confirm_changes = true
enable_confirmations = true


[functions.scrape-whisky]
enabled = true
verify_jwt = false
import_map = "./functions/scrape-whisky/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/scrape-whisky/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/scrape-whisky/*.html" ]

[functions.gemini-proxy]
enabled = true
verify_jwt = false
entrypoint = "./functions/gemini-proxy/index.ts"
