name: Benchmark AI Models

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Run benchmark
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY || secrets.VITE_GEMINI_KEY }}
        run: node scripts/benchmark-models.js
