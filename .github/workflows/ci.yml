name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check scripts
        run: find scripts -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
